<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Original tiling pattern: portals, atom, flask, planet, saucer, pickle, stars. Kept faint on purpose. -->
  <defs>
    <radialGradient id="pg" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9f06a" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#7fbf2e" stop-opacity=".10"/>
      <stop offset="1" stop-color="#2f6a1c" stop-opacity="0"/>
    </radialGradient>
    <g id="portal">
      <circle r="30" fill="url(#pg)"/>
      <path d="M0 -24 C14 -24 24 -12 22 2 C20 14 8 20 -2 18 C-12 16 -16 6 -12 -2 C-8 -10 2 -10 6 -4 C9 1 5 6 0 5"
            fill="none" stroke="#a6e13a" stroke-opacity=".28" stroke-width="2.2" stroke-linecap="round"/>
      <circle r="27" fill="none" stroke="#a6e13a" stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="6 7"/>
    </g>
  </defs>

  <g opacity=".75">

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- portals -->
    <use href="#portal" transform="translate(70 70)"/>
    <use href="#portal" transform="translate(270 250) scale(.7) rotate(120)"/>

    <!-- atom -->
    <g transform="translate(250 70)" stroke="#5fd3e6" stroke-opacity=".22" stroke-width="1.6">
      <ellipse rx="24" ry="9"/>
      <ellipse rx="24" ry="9" transform="rotate(60)"/>
      <ellipse rx="24" ry="9" transform="rotate(-60)"/>
      <circle r="3" fill="#5fd3e6" fill-opacity=".3" stroke="none"/>
    </g>

    <!-- flask -->
    <g transform="translate(160 170) rotate(-14)" stroke="#a6e13a" stroke-opacity=".22" stroke-width="1.6">
      <path d="M-6 -22 H6 M-4 -22 V-6 L-16 16 Q-18 22 -12 22 H12 Q18 22 16 16 L4 -6 V-22"/>
      <path d="M-12 12 Q0 7 12 12" stroke-opacity=".3"/>
      <circle cx="-3" cy="15" r="2" fill="#a6e13a" fill-opacity=".25" stroke="none"/>
      <circle cx="5" cy="17" r="1.4" fill="#a6e13a" fill-opacity=".25" stroke="none"/>
    </g>

    <!-- ringed planet -->
    <g transform="translate(70 270)" stroke="#5fd3e6" stroke-opacity=".2" stroke-width="1.6">
      <circle r="14"/>
      <ellipse rx="28" ry="7" transform="rotate(-18)"/>
    </g>

    <!-- flying saucer -->
    <g transform="translate(300 160) rotate(10)" stroke="#a6e13a" stroke-opacity=".22" stroke-width="1.6">
      <path d="M-10 -4 Q0 -18 10 -4"/>
      <ellipse rx="24" ry="7"/>
      <path d="M-6 9 L-12 20 M6 9 L12 20" stroke-opacity=".14" stroke-dasharray="2 3"/>
    </g>

    <!-- pickle -->
    <g transform="translate(180 300) rotate(35)" stroke="#a6e13a" stroke-opacity=".24" stroke-width="1.6">
      <rect x="-9" y="-24" width="18" height="48" rx="9"/>
      <circle cx="-2" cy="-8" r=".9" fill="#a6e13a" fill-opacity=".35" stroke="none"/>
      <circle cx="3" cy="4" r=".9" fill="#a6e13a" fill-opacity=".35" stroke="none"/>
      <circle cx="-3" cy="13" r=".9" fill="#a6e13a" fill-opacity=".35" stroke="none"/>
    </g>
  </g>

  <!-- stars and sparkles -->
  <g fill="#eaf2e3">
    <circle cx="150" cy="40" r="1.2" fill-opacity=".35"/>
    <circle cx="20" cy="170" r="1" fill-opacity=".3"/>
    <circle cx="340" cy="20" r="1.1" fill-opacity=".3"/>
    <circle cx="110" cy="210" r=".9" fill-opacity=".25"/>
    <circle cx="230" cy="340" r="1.2" fill-opacity=".3"/>
    <circle cx="350" cy="320" r=".9" fill-opacity=".25"/>
  </g>
  <g fill="#a6e13a" fill-opacity=".3">
    <path d="M200 110 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <path d="M30 340 l1.5 3.5 l3.5 1.5 l-3.5 1.5 l-1.5 3.5 l-1.5 -3.5 l-3.5 -1.5 l3.5 -1.5 z"/>
  </g>
  </g>
</svg>
